name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: mypy --ignore-missing-imports src
      - run: bandit -q -ll -r src
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck docker/entrypoint.sh systemd/install.sh tests/e2e/certbot-wrapper.sh tests/e2e/run.sh

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n docker/entrypoint.sh systemd/install.sh tests/e2e/certbot-wrapper.sh tests/e2e/run.sh
      - run: systemd-analyze verify systemd/cert-renewer.service
      - run: docker build -t cert-renewer:test .
      - run: docker compose -f docker/compose.yaml config -q
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cert-renewer:test
          severity: CRITICAL,HIGH
          exit-code: "1"

  acme-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cert-renewer:e2e-base .
      - run: docker compose -f tests/e2e/compose.yaml up --build --abort-on-container-exit --exit-code-from cert-renewer
      - if: always()
        run: docker compose -f tests/e2e/compose.yaml down -v
