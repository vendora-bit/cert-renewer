name: Bug report
description: Report a reproducible problem without secrets or private keys.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include Cloudflare tokens, private keys, certificate files or a Docker socket path. See SECURITY.md for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: cert-renewer version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker, Docker Compose, systemd, Other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and sanitized logs
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: "Redact domains if necessary; do not include credentials."
    validations:
      required: true

