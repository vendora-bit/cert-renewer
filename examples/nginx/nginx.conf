server {
  listen 443 ssl;
  server_name example.com;

  ssl_certificate     /etc/nginx/certificates/example.com/current/fullchain.pem;
  ssl_certificate_key /etc/nginx/certificates/example.com/current/privkey.pem;

  location / {
    return 200 "cert-renewer is serving an atomically installed certificate\n";
  }
}

